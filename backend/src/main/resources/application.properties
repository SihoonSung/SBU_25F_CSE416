spring.config.import=optional:file:.env
spring.application.name=sam-system

# --- DB ---
spring.datasource.url=jdbc:mysql://localhost:3306/sam
spring.datasource.username=root
spring.datasource.password=Shsung0207@
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080
# Local development (HTTP) cookie settings
# server.servlet.session.cookie.secure=false
# server.servlet.session.cookie.same-site=LAX

# --- Google OAuth2 / OIDC ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
# Fixed absolute path to avoid proxy/port confusion
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OIDC recommended: issuer-uri automatically loads metadata
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

