# Environment variables are loaded from .env file via dotenv-java library
# The .env file should be in the backend directory (working directory when running the app)
spring.application.name=sam-system

# --- DB ---
spring.datasource.url=jdbc:mysql://localhost:3306/sam
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# --- Server ---
server.port=8080
# Local development (HTTP) cookie settings
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=LAX
server.servlet.session.cookie.domain=localhost

# --- Google OAuth2 / OIDC ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
# Fixed absolute path to avoid proxy/port confusion
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OIDC recommended: issuer-uri automatically loads metadata
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# (Unnecessary for OIDC, explicitly removed)
# spring.security.oauth2.client.provider.google.authorization-uri=...
# spring.security.oauth2.client.provider.google.token-uri=...
# spring.security.oauth2.client.provider.google.user-info-uri=...
# spring.security.oauth2.client.provider.google.user-name-attribute=sub

# --- DevTools Settings (if enabled) ---
# spring.devtools.restart.enabled=false
# spring.devtools.livereload.enabled=false
# spring.devtools.restart.exclude=static/**,public/**

# --- Authentication Bypass Mode (Demo/Test Only) ---
auth.bypass.enabled=true
