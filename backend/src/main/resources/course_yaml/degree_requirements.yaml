# TP: Used Cursor to implement degree requirements management system: divided major, minor degree requirements
degree_requirements:
  - subject_code: CSE
    is_active: true
    entries:
    - degree_type: BS
      title: "CSE MAJOR"
      is_restricted: true
      degree_credits_required: 80
      total_credits_required: 120

      admission:
        minimum_cumulative_gpa: 3.0
        minimum_core_avg_gpa: 3.2
        minimum_core_grade: "B-"
        retake_in_core: 1
        core_courses:
          - { code: "CSE 114" }
          - { code: "CSE 214" }
          - { code: "CSE 215" }

      course_requirements:
        groups:
          # Required Introductory Courses
          - id: intro_courses
            type: all_of
            courses:
              - { code: "CSE 114" }
              - { code: "CSE 214" }
              - { code: "CSE 215" }
              - { code: "CSE 216" }
              - { code: "CSE 220" }

          # Required Advanced Courses
          - id: advanced_fixed
            type: all_of
            courses:
              - { code: "CSE 303" }
              - { code: "CSE 310" }
              - { code: "CSE 316" }
              - { code: "CSE 320" }
              - { code: "CSE 373" }
              - { code: "CSE 416" }

          # Calculus sequence (choose one full sequence)
          - id: calculus_sequence
            type: one_of_sequences
            sequences:
              - [ { code: "AMS 151" }, { code: "AMS 161" } ]
              - [ { code: "MAT 125" }, { code: "MAT 126" }, { code: "MAT 127" } ]
              - [ { code: "MAT 131" }, { code: "MAT 132" } ]

          # Linear algebra choice
          - id: linear_algebra
            type: one_of
            courses:
              - { code: "MAT 211" }
              - { code: "AMS 210" }

          # Statistics requirement (both courses required)
          - id: statistics
            type: all_of
            courses:
              - { code: "AMS 301" }
              - { code: "AMS 310" }

          # Natural Science Requirements (items 7 and 8: at least 9 credits total)
          # Must include at least one lab sequence from item 7, plus additional courses from items 7 and 8
          - id: natural_science_requirement
            type: electives
            credits_required: 9
            sequences:
              - [ { code: "BIO 201" }, { code: "BIO 204" } ]
              - [ { code: "BIO 202" }, { code: "BIO 204" } ]
              - [ { code: "BIO 203" }, { code: "BIO 204" } ]
              - [ { code: "CHE 131" }, { code: "CHE 133" } ]
              - [ { code: "CHE 152" }, { code: "CHE 154" } ]
              - [ { code: "PHY 126" }, { code: "PHY 133" } ]
              - [ { code: "PHY 131" }, { code: "PHY 133" } ]
              - [ { code: "PHY 141" }, { code: "PHY 133" } ]
            additional_courses:
              - { code: "AST 203" }
              - { code: "AST 205" }
              - { code: "CHE 132" }
              - { code: "CHE 321" }
              - { code: "CHE 322" }
              - { code: "CHE 331" }
              - { code: "CHE 332" }
              - { code: "GEO 102" }
              - { code: "GEO 103" }
              - { code: "GEO 112" }
              - { code: "GEO 113" }
              - { code: "GEO 122" }
              - { code: "PHY 125" }
              - { code: "PHY 127" }
              - { code: "PHY 132" }
              - { code: "PHY 134" }
              - { code: "PHY 142" }
              - { code: "PHY 251" }
              - { code: "PHY 252" }

          # Professional Ethics (item 9)
          - id: professional_ethics
            type: all_of
            courses:
              - { code: "CSE 312" }

          # Upper-Division Writing Requirement (item 10)
          - id: upper_division_writing
            type: all_of
            courses:
              - { code: "CSE 300" }

          # Upper-division CSE electives
          - id: cse_upper_electives
            type: electives
            credits_required: 12   # four upper-division technical CSE electives
            courses:
              - { code: "CSE 3xx+" }  # placeholder rule for frontend filtering
            excluded_courses:
              - { code: "CSE 301" }  # non-technical course
              - { code: "CSE 475" }  # teaching practica
    
      sbc_categories:
        - sbc: "ARTS"
